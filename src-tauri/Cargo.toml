[package]
name = "ccdeck"
version = "0.1.6"
description = "Переключение аккаунтов Claude Code и управление сессиями"
edition = "2021"

[lib]
name = "ccdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = true
lto = true
opt-level = "s"

[dependencies]
dirs = "7.0.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
trash = "5.3.0"
ureq = { version = "3.5.2", features = ["json"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[target."cfg(windows)".dependencies]
junction = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
