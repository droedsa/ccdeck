<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CC Deck</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <span class="logo"></span>
      <span>CC Deck</span>
      <span id="ver" class="ver"></span>
    </div>
    <div id="update" hidden></div>

    <div class="section-label">Аккаунты</div>
    <div id="accounts"></div>
    <button id="add-account" class="ghost wide">+ Добавить аккаунт</button>
    <div id="vscode-status"></div>

    <div class="section-label">Проекты</div>
    <div id="projects"></div>
  </aside>

  <main>
    <header>
      <div class="search">
        <input id="q" type="search" placeholder="Поиск по чатам и проектам…  ( / )" autocomplete="off">
        <button id="deep" class="ghost" title="Искать по тексту всех сообщений (Ctrl+Enter)">Искать в переписке</button>
        <button id="help" class="ghost" title="Как это работает">?</button>
      </div>
      <div class="filters">
        <label><input type="checkbox" id="hide-missing" checked> Скрыть чаты без папки</label>
        <span id="count" class="muted"></span>
        <button id="refresh" class="ghost" title="Обновить (F5)">⟳</button>
      </div>
    </header>

    <div id="banner" hidden></div>
    <div id="project-bar" hidden></div>
    <div id="list" class="list"></div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="card" id="modal-card"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
